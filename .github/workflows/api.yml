name: api

on:
  push:
    paths:
      - apps/api/**
      - contracts/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - apps/api/**
      - contracts/**
      - .github/workflows/api.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests with total coverage gate (80 %)
        run: uv run pytest
      # Skipped until the critical-flow modules exist: coverage fails with "No data to report".
      - name: Critical-flow coverage gate (90 %)
        if: hashFiles('apps/api/src/droidesk_api/tickets/**', 'apps/api/src/droidesk_api/sla/**', 'apps/api/src/droidesk_api/audit/**', 'apps/api/src/droidesk_api/identity/authorization.py') != ''
        run: >-
          uv run coverage report --fail-under=90
          --include='src/droidesk_api/tickets/*,src/droidesk_api/sla/*,src/droidesk_api/audit/*,src/droidesk_api/identity/authorization.py'
      # Skipped until Alembic is configured (migrations/env.py).
      - name: Migrations match the models
        if: hashFiles('apps/api/migrations/env.py') != ''
        env:
          DROIDESK_DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: OpenAPI contract is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../../contracts/openapi.json
